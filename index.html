<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gran Mesa — Produção</title>
<style>
  :root {
    --verde: #1E3310;
    --lima: #C5D42E;
    --creme: #F5F0E8;
    --card-bg: #FFFFFF;
    --produzindo: #FFF3CD;
    --produzindo-border: #F0A500;
    --finalizado: #E8F5E9;
    --finalizado-border: #81C784;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(0,0,0,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--creme); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

  /* ── HEADER ── */
  header {
    background: var(--verde);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px;
    height: 68px;
  }
  header img { height: 44px; filter: brightness(0) invert(1); }
  .header-center { text-align: center; color: white; }
  .header-center h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  .header-center .data { font-size: 13px; opacity: 0.75; margin-top: 2px; }
  .refresh-btn {
    background: var(--lima); border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 700;
    color: var(--verde); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .refresh-countdown { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; text-align: right; }

  /* ── TABS OPERADORES ── */
  .tabs-container {
    background: var(--verde);
    padding: 0 24px 0;
    display: flex; gap: 4px; overflow-x: auto;
    border-bottom: 3px solid var(--lima);
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 20px; border-radius: 10px 10px 0 0;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
    cursor: pointer; font-size: 14px; font-weight: 600;
    white-space: nowrap; border: none; transition: all 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .tab.active { background: var(--creme); color: var(--verde); }
  .tab .badge {
    background: var(--lima); color: var(--verde);
    border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 800;
  }
  .tab.active .badge { background: var(--verde); color: var(--lima); }

  /* ── CONTEÚDO PRINCIPAL ── */
  .main-content {
    height: calc(100vh - 68px - 45px);
    overflow-y: auto; overflow-x: hidden;
    padding: 20px 24px;
    scroll-behavior: smooth;
  }

  /* ── SEÇÕES DE FASE ── */
  .fase-section { margin-bottom: 24px; }
  .fase-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .fase-badge {
    padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .fase-badge.a-produzir { background: #E0E0E0; color: #555; }
  .fase-badge.em-producao { background: var(--produzindo-border); color: #7A4F00; }
  .fase-badge.finalizado { background: var(--finalizado-border); color: #2E7D32; }
  .fase-count { font-size: 13px; color: #999; }

  /* ── GRID DE CARDS ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border-left: 5px solid #E0E0E0;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .card.em-producao { border-left-color: var(--produzindo-border); background: var(--produzindo); }
  .card.finalizado { border-left-color: var(--finalizado-border); background: var(--finalizado); opacity: 0.75; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-sku { font-size: 11px; color: #999; font-weight: 600; letter-spacing: 1px; }
  .card-horario {
    font-size: 12px; font-weight: 700;
    background: var(--verde); color: white;
    padding: 2px 8px; border-radius: 6px;
  }
  .card.finalizado .card-horario { background: var(--finalizado-border); }

  .card-nome { font-size: 16px; font-weight: 700; color: #1A1A1A; margin-bottom: 6px; line-height: 1.3; }
  .card.finalizado .card-nome { color: #555; }

  .card-qtd { font-size: 13px; color: #666; margin-bottom: 14px; }
  .card-qtd span { font-weight: 700; color: #333; font-size: 15px; }

  /* ── BOTÕES DE AÇÃO ── */
  .btn-iniciar, .btn-finalizar, .btn-feito {
    width: 100%; padding: 12px; border-radius: 10px;
    font-size: 15px; font-weight: 700; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .btn-iniciar:active, .btn-finalizar:active { transform: scale(0.97); }
  .btn-iniciar { background: var(--lima); color: var(--verde); }
  .btn-finalizar { background: var(--verde); color: white; }
  .btn-feito { background: transparent; color: var(--finalizado-border); border: 2px solid var(--finalizado-border); font-size: 13px; padding: 8px; cursor: default; }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 40px; color: #aaa; }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

  /* ── LOADING ── */
  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(30,51,16,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; color: white; flex-direction: column; gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.3);
    border-top-color: var(--lima); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 20px;
    padding: 28px; width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 { font-size: 20px; color: var(--verde); margin-bottom: 6px; }
  .modal .modal-produto { font-size: 14px; color: #777; margin-bottom: 20px; }
  .modal label { font-size: 13px; font-weight: 700; color: #555; display: block; margin-bottom: 6px; margin-top: 16px; }
  .modal select, .modal input[type=number], .modal textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 2px solid #E0E0E0; font-size: 16px; background: #FAFAFA;
    outline: none; transition: border-color 0.15s;
  }
  .modal select:focus, .modal input:focus, .modal textarea:focus { border-color: var(--lima); }
  .modal textarea { resize: none; height: 80px; }
  .radio-group { display: flex; gap: 10px; margin-top: 4px; }
  .radio-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #E0E0E0;
    font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;
    background: white; transition: all 0.15s; touch-action: manipulation;
  }
  .radio-btn.selected-sim { background: var(--finalizado); border-color: var(--finalizado-border); color: #2E7D32; }
  .radio-btn.selected-nao { background: #FFEBEE; border-color: #E57373; color: #C62828; }
  .motivo-group { display: none; }
  .motivo-group.visible { display: block; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-cancelar {
    flex: 1; padding: 14px; border-radius: 12px; border: 2px solid #E0E0E0;
    background: white; font-size: 15px; font-weight: 700; color: #999; cursor: pointer;
  }
  .btn-confirmar {
    flex: 2; padding: 14px; border-radius: 12px; border: none;
    background: var(--verde); color: white; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-confirmar:disabled { background: #CCC; cursor: not-allowed; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: 600; z-index: 9999;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--verde); }
  .toast.error { background: #C62828; }
</style>
</head>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div style="font-size:15px;font-weight:600;">Carregando produção...</div>
</div>

<script>
const TOKEN = "eyJhbGciOiJIUzUxMiJ9.eyJpc3MiOiJQaXBlZnkiLCJpYXQiOjE3Nzg2NzU4MDQsImp0aSI6ImZiZTRiNDcwLTNkZTItNDRlMC04MzRlLWViMDllM2ZjZDBmYSIsInN1YiI6MzA1NDU2NjM3LCJ1c2VyIjp7ImlkIjozMDU0NTY2MzcsImVtYWlsIjoibWF5YXJhLnBlcmVpcmFAZ3J1cG9hNy5jb20uYnIifSwidXNlcl90eXBlIjoiYXV0aGVudGljYXRlZCJ9.TTrXnSxVzbKBTh1pVzWiN2kO2230YfBrqdEuE_iOEWYj3QhzvwE-ySPocPRjsHtOfQqxwzC11FGu_BMdPlsPCw";
const PIPE_ID = "307152521";
const FASE_A_PRODUZIR  = "343131777";
const FASE_EM_PRODUCAO = "343131778";
const FASE_FINALIZADO  = "343131779";
const FIELD_OPERADORA    = "operadora_executora";
const FIELD_QTD          = "quantidade_real_produzida";
const FIELD_CONFORME     = "conforme_planejado";
const FIELD_MOTIVO       = "motivo_da_diverg_ncia";

let todosCards = [];
let operadoresAtivos = [];
let operadorAtivo = null;
let cardSelecionado = null;
let conformeSelecionado = null;
let countdownTimer = null;
let refreshTimer = null;

// ── GraphQL ────────────────────────────────────────────────────────────────
async function gql(query, variables = {}) {
  const resp = await fetch("https://api.pipefy.com/graphql", {
    method: "POST",
    headers: { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  const data = await resp.json();
  if (data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

// ── Carregar dados ─────────────────────────────────────────────────────────
async function carregarDados() {
  document.getElementById("loading").style.display = "flex";
  resetCountdown();
  try {
    const data = await gql(`{
      pipe(id: "${PIPE_ID}") {
        phases {
          id name
          cards(first: 100) {
            edges { node {
              id title due_date
              fields { name value array_value phase_field { id } }
            }}
          }
        }
      }
    }`);

    todosCards = [];
    for (const phase of data.pipe.phases) {
      for (const edge of phase.cards.edges) {
        const card = edge.node;
        const campos = {};
        for (const f of card.fields) campos[f.phase_field.id] = f.value || (f.array_value && f.array_value[0]) || "";
        todosCards.push({
          id: card.id,
          titulo: card.title,
          fase_id: phase.id,
          fase_nome: phase.name,
          sku: campos["c_digo_sku"] || "",
          descricao: campos["descri_o_do_produto"] || card.title,
          qtd_planejada: campos["quantidade_planejada"] || "",
          unidade: campos["unidade_de_medida"] || "un",
          horario_alvo: campos["hor_rio_alvo_de_finaliza_o"] || "",
          operador: campos["operador_respons_vel"] || "",
          operadora_executora: campos["operadora_executora"] || "",
          qtd_produzida: campos["quantidade_real_produzida"] || "",
          conforme: campos["conforme_planejado"] || "",
        });
      }
    }

    // Operadores com cards ativos
    const ops = new Set();
    for (const c of todosCards) {
      if (c.operador) ops.add(c.operador);
      if (c.operadora_executora) ops.add(c.operadora_executora);
    }
    operadoresAtivos = [...ops].sort();
    if (!operadorAtivo || !operadoresAtivos.includes(operadorAtivo)) {
      operadorAtivo = operadoresAtivos[0] || null;
    }

    atualizarData();
    renderizarTabs();
    renderizarCards();
  } catch(e) {
    mostrarToast("Erro ao carregar: " + e.message, "error");
    console.error(e);
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

function atualizarData() {
  const agora = new Date();
  const diasSemana = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const titulo = `${diasSemana[agora.getDay()]}, ${agora.getDate()} de ${meses[agora.getMonth()]}`;
  document.getElementById("header-data").textContent = titulo;
  document.getElementById("titulo-data").textContent = "Produção do Dia";
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function renderizarTabs() {
  const container = document.getElementById("tabs-container");
  container.innerHTML = "";
  if (!operadoresAtivos.length) return;
  for (const op of operadoresAtivos) {
    const count = todosCards.filter(c =>
      (c.operador === op || c.operadora_executora === op) && c.fase_id !== FASE_FINALIZADO
    ).length;
    const tab = document.createElement("button");
    tab.className = "tab" + (op === operadorAtivo ? " active" : "");
    tab.innerHTML = `${op} <span class="badge">${count}</span>`;
    tab.onclick = () => { operadorAtivo = op; renderizarTabs(); renderizarCards(); };
    container.appendChild(tab);
  }
}

// ── Cards ──────────────────────────────────────────────────────────────────
function renderizarCards() {
  const container = document.getElementById("main-content");
  if (!operadorAtivo) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🌿</div><div>Nenhuma produção registrada hoje.</div></div>`;
    return;
  }
  const meuCards = todosCards.filter(c => c.operador === operadorAtivo || c.operadora_executora === operadorAtivo);
  const aProduzir   = meuCards.filter(c => c.fase_id === FASE_A_PRODUZIR);
  const emProducao  = meuCards.filter(c => c.fase_id === FASE_EM_PRODUCAO);
  const finalizados = meuCards.filter(c => c.fase_id === FASE_FINALIZADO);

  let html = "";
  if (emProducao.length) {
    html += renderFase("Em Produção", "em-producao", emProducao);
  }
  if (aProduzir.length) {
    html += renderFase("A Produzir", "a-produzir", aProduzir);
  }
  if (!emProducao.length && !aProduzir.length) {
    html += `<div class="empty-state"><div class="icon">✅</div><div style="font-size:18px;font-weight:700;color:#2E7D32">Tudo produzido!</div></div>`;
  }
  if (finalizados.length) {
    html += renderFase("Finalizado", "finalizado", finalizados);
  }
  container.innerHTML = html;
}

function renderFase(nome, cls, cards) {
  const cardsHtml = cards.map(c => renderCard(c, cls)).join("");
  return `<div class="fase-section">
    <div class="fase-header">
      <span class="fase-badge ${cls}">${nome}</span>
      <span class="fase-count">${cards.length} ${cards.length === 1 ? "item" : "itens"}</span>
    </div>
    <div class="cards-grid">${cardsHtml}</div>
  </div>`;
}

function renderCard(c, cls) {
  const porcao = c.unidade && c.qtd_planejada ? `${c.qtd_planejada} ${c.unidade}` : c.qtd_planejada || "—";
  let btnHtml = "";
  if (cls === "a-produzir") {
    btnHtml = `<button class="btn-iniciar" onclick="abrirIniciar('${c.id}')">▶ Iniciar</button>`;
  } else if (cls === "em-producao") {
    btnHtml = `<button class="btn-finalizar" onclick="abrirFinalizar('${c.id}')">✓ Finalizar</button>`;
  } else {
    const qtdP = c.qtd_produzida ? ` · ${c.qtd_produzida} produzidos` : "";
    btnHtml = `<button class="btn-feito">✓ Concluído${qtdP}</button>`;
  }
  return `<div class="card ${cls}">
    <div class="card-header">
      <span class="card-sku">SKU ${c.sku}</span>
      ${c.horario_alvo ? `<span class="card-horario">${c.horario_alvo}</span>` : ""}
    </div>
    <div class="card-nome">${c.descricao}</div>
    <div class="card-qtd">Qtd planejada: <span>${porcao}</span></div>
    ${btnHtml}
  </div>`;
}

// ── Modal Iniciar ──────────────────────────────────────────────────────────
function abrirIniciar(cardId) {
  cardSelecionado = todosCards.find(c => String(c.id) === String(cardId)) || null;
  if (!cardSelecionado) { mostrarToast("Erro: card não encontrado (tente atualizar)", "error"); return; }
  document.getElementById("iniciar-produto").textContent = cardSelecionado.descricao;
  document.getElementById("iniciar-operador").value = "";
  document.getElementById("modal-iniciar").classList.add("open");
}

async function confirmarIniciar() {
  const operador = document.getElementById("iniciar-operador").value;
  if (!operador) { mostrarToast("Selecione o operador", "error"); return; }
  const cardId = cardSelecionado.id;
  fecharModal("iniciar");
  document.getElementById("loading").style.display = "flex";
  try {
    await gql(`mutation {
      updateCardField(input: { card_id: "${cardId}", field_id: "${FIELD_OPERADORA}", new_value: "${operador}" }) { card { id } }
    }`);
    await gql(`mutation {
      moveCardToPhase(input: { card_id: "${cardId}", destination_phase_id: "${FASE_EM_PRODUCAO}" }) { card { id } }
    }`);
    mostrarToast("Produção iniciada!", "success");
    await carregarDados();
  } catch(e) {
    mostrarToast("Erro: " + e.message, "error");
    document.getElementById("loading").style.display = "none";
  } finally {
    cardSelecionado = null;
  }
}

// ── Modal Finalizar ────────────────────────────────────────────────────────
function abrirFinalizar(cardId) {
  cardSelecionado = todosCards.find(c => String(c.id) === String(cardId)) || null;
  if (!cardSelecionado) { mostrarToast("Erro: card não encontrado (tente atualizar)", "error"); return; }
  conformeSelecionado = null;
  document.getElementById("finalizar-produto").textContent = cardSelecionado.descricao;
  document.getElementById("finalizar-qtd").value = "";
  document.getElementById("rbtn-sim").className = "radio-btn";
  document.getElementById("rbtn-nao").className = "radio-btn";
  document.getElementById("motivo-group").className = "motivo-group";
  document.getElementById("finalizar-motivo").value = "";
  document.getElementById("btn-confirmar-finalizar").disabled = true;
  document.getElementById("modal-finalizar").classList.add("open");
}

function selecionarConforme(val) {
  conformeSelecionado = val;
  document.getElementById("rbtn-sim").className = "radio-btn" + (val === "Sim" ? " selected-sim" : "");
  document.getElementById("rbtn-nao").className = "radio-btn" + (val === "Não" ? " selected-nao" : "");
  document.getElementById("motivo-group").className = "motivo-group" + (val === "Não" ? " visible" : "");
  validarFinalizar();
}

function validarFinalizar() {
  const qtd = document.getElementById("finalizar-qtd").value;
  const motivo = document.getElementById("finalizar-motivo").value.trim();
  const ok = qtd && conformeSelecionado && (conformeSelecionado === "Sim" || motivo.length > 0);
  document.getElementById("btn-confirmar-finalizar").disabled = !ok;
}

async function confirmarFinalizar() {
  const qtd = document.getElementById("finalizar-qtd").value;
  const motivo = document.getElementById("finalizar-motivo").value.trim();
  const cardId = cardSelecionado.id;
  fecharModal("finalizar");
  document.getElementById("loading").style.display = "flex";
  try {
    await gql(`mutation { updateCardField(input: { card_id: "${cardId}", field_id: "${FIELD_QTD}", new_value: "${qtd}" }) { card { id } } }`);
    await gql(`mutation { updateCardField(input: { card_id: "${cardId}", field_id: "${FIELD_CONFORME}", new_value: "${conformeSelecionado}" }) { card { id } } }`);
    if (conformeSelecionado === "Não" && motivo) {
      await gql(`mutation { updateCardField(input: { card_id: "${cardId}", field_id: "${FIELD_MOTIVO}", new_value: ${JSON.stringify(motivo)} }) { card { id } } }`);
    }
    await gql(`mutation { moveCardToPhase(input: { card_id: "${cardId}", destination_phase_id: "${FASE_FINALIZADO}" }) { card { id } } }`);
    mostrarToast("Produção finalizada! ✓", "success");
    await carregarDados();
  } catch(e) {
    mostrarToast("Erro: " + e.message, "error");
    document.getElementById("loading").style.display = "none";
  } finally {
    cardSelecionado = null;
  }
}

function fecharModal(tipo) {
  document.getElementById(`modal-${tipo}`).classList.remove("open");
}

// ── Toast ──────────────────────────────────────────────────────────────────
function mostrarToast(msg, tipo = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast ${tipo} show`;
  setTimeout(() => { t.className = "toast"; }, 3000);
}

// ── Auto-refresh countdown ─────────────────────────────────────────────────
function resetCountdown() {
  clearInterval(refreshTimer);
  clearInterval(countdownTimer);
  let segundos = 300;
  countdownTimer = setInterval(() => {
    segundos--;
    const m = Math.floor(segundos / 60);
    const s = segundos % 60;
    document.getElementById("countdown").textContent = `Atualiza em ${m}:${String(s).padStart(2,"0")}`;
    if (segundos <= 0) {
      clearInterval(countdownTimer);
      carregarDados();
    }
  }, 1000);
}

// ── Init ───────────────────────────────────────────────────────────────────
carregarDados();
</script>
